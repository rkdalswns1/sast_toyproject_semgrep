<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SAST MVP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    {% if current_user is defined %}
    <div class="app-layout">
      <aside class="site-sidebar">
        <a class="site-brand" href="/projects">SecureScan</a>
        <nav class="site-nav-links" aria-label="주요 메뉴">
          <a href="/projects" {% if request.url.path.startswith('/projects') %}aria-current="page"{% endif %}>프로젝트</a>
          <a href="/rules" {% if request.url.path.startswith('/rules') %}aria-current="page"{% endif %}>KISA 규칙</a>
          {% if current_user.role.value == "ADMIN" %}
          <a href="/users" {% if request.url.path.startswith('/users') %}aria-current="page"{% endif %}>사용자 관리</a>
          {% endif %}
        </nav>
      </aside>
      <div class="app-content">
    {% endif %}
    {% block content %}{% endblock %}
    {% if current_user is defined %}
      </div>
    </div>
    {% endif %}
  </body>
</html>
