rules:
  - id: kisa-2021-sql-injection-python
    languages: [python]
    severity: ERROR
    message: SQL query is constructed with string concatenation.
    metadata:
      confidence: HIGH
      recommendation: Use parameterized queries instead of concatenating untrusted input.
    pattern: $CURSOR.execute($QUERY + $VALUE)

  - id: kisa-2021-os-command-injection-python
    languages: [python]
    severity: ERROR
    message: A shell command is executed with shell=True.
    metadata:
      confidence: HIGH
      recommendation: Avoid shell=True and pass a fixed command with validated arguments.
    pattern: subprocess.$METHOD($COMMAND, shell=True)

  - id: kisa-2021-hardcoded-sensitive-information-python
    languages: [python]
    severity: ERROR
    message: Sensitive information appears to be hardcoded in source code.
    metadata:
      confidence: MEDIUM
      recommendation: Load secrets from a protected configuration source instead of source code.
    patterns:
      - pattern: $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|secret|token|api_key).*

  - id: kisa-2021-weak-crypto-python
    languages: [python]
    severity: WARNING
    message: A weak cryptographic hash algorithm is used.
    metadata:
      confidence: HIGH
      recommendation: Use a modern cryptographic algorithm suitable for the security purpose.
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
